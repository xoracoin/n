<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>XORA COIN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8b84a;--gold2:#f3c94f;--bg:#0b0906;--card:#12100b;--line:rgba(214,170,60,.16);--pill:#1b1710;--muted:#8d8678;--green:#4ddc7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#000;color:#fff;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;
 background:radial-gradient(120% 45% at 50% 0%,rgba(110,88,16,.55) 0%,rgba(60,48,10,.28) 45%,transparent 75%),var(--bg)}
#view{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 14px) 14px 118px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
/* header */
.hdr{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(24,20,12,.92),rgba(16,13,8,.92));border:1px solid var(--line);border-radius:22px;padding:11px 12px}
.ava{width:48px;height:48px;border-radius:50%;background:#fff;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;border:1px solid rgba(232,184,74,.5)}
.ava img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.who small{display:block;font-size:11px;letter-spacing:.14em;color:#8a7f66;font-weight:600}
.who b{display:block;font-size:14px;font-weight:600;color:#cfc7b6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;background:var(--pill);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.03)}
/* nav */
.nav{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:80px;display:flex;justify-content:space-around;align-items:center;
 background:linear-gradient(180deg,#14110b,#0f0d08);border:1px solid rgba(214,170,60,.22);border-radius:28px;box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:10}
.nav button{background:none;border:0;color:#8f897b;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 10.5px 'Poppins',sans-serif;letter-spacing:.07em;position:relative;width:20%;cursor:pointer}
.nav button.on{color:var(--gold)}
.nav svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .dot{position:absolute;top:-2px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
/* mine */
.bal{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:26px}
.bal b{font-size:46px;font-weight:700;letter-spacing:-.5px;line-height:1}
.tapx{display:flex;width:max-content;margin:12px auto 0;align-items:center;gap:7px;background:rgba(27,23,14,.9);border:1px solid var(--line);border-radius:16px;padding:6px 16px;font-size:12px;color:var(--gold2);font-weight:600}
.coinwrap{position:relative;width:min(78vw,350px);aspect-ratio:1;margin:22px auto 0;touch-action:manipulation}
.coinwrap::before{content:"";position:absolute;inset:-8%;background:radial-gradient(circle,rgba(232,184,74,.16),transparent 65%)}
.coin{position:relative;width:100%;height:100%;transition:transform .08s;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.coin svg,.coin img{width:100%;height:100%;display:block;pointer-events:none}.coin img{border-radius:50%}
.fl{position:absolute;font-weight:700;font-size:30px;color:#fff;pointer-events:none;animation:fly .8s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6);z-index:5}
@keyframes fly{to{transform:translateY(-90px);opacity:0}}
.mini{display:flex;gap:12px;justify-content:center;margin-top:20px}
.mini button{display:flex;align-items:center;gap:8px;background:rgba(21,18,11,.9);border:1px solid rgba(214,170,60,.28);border-radius:20px;color:var(--gold2);font:700 12px 'Poppins',sans-serif;letter-spacing:.06em;padding:9px 18px;cursor:pointer}
.mini svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.energy{margin-top:32px;padding:0 6px}
.energy .r{display:flex;align-items:center;justify-content:space-between}
.energy .l{display:flex;align-items:center;gap:8px;color:#a39a86;font-weight:600;font-size:13px;letter-spacing:.12em}
.energy .l svg{width:16px;height:16px;fill:var(--gold2)}
.energy .n{font-size:26px;font-weight:700}.energy .n span{font-size:17px;color:#6f6858;font-weight:500}
.bar{height:24px;border-radius:12px;background:#1a1710;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#f3d24a,#e0aa28)}
/* tabs / cards */
.seg{display:flex;background:#12100b;border:1px solid var(--line);border-radius:22px;padding:7px;margin-top:20px}
.seg button{flex:1;border:0;border-radius:16px;padding:14px 0;background:none;color:#cfc7b6;font:700 15px 'Poppins',sans-serif;letter-spacing:.05em;cursor:pointer}
.seg button.on{background:var(--gold);color:#17120a;box-shadow:0 4px 14px rgba(232,184,74,.25)}
.list{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#14110b,#100e09);border:1px solid var(--line);border-radius:24px;padding:14px}
.card .im{width:96px;height:96px;border-radius:16px;background:#22190d center/cover no-repeat;flex:none}
.card .tx{flex:1;min-width:0}
.card .t{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:#6f6858;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pr{display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:600;font-size:14px}
.card .pr em{font-style:normal;color:#6f6858;font-size:12px}
.card .tm{display:flex;align-items:center;gap:8px;margin-top:8px}
.card .tm b{color:var(--green);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.auto{background:#232014;border-radius:9px;color:#8a8470;font-size:11px;font-weight:700;padding:3px 9px;letter-spacing:.05em}
.go{width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#17120a;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;box-shadow:0 4px 14px rgba(232,184,74,.25)}
.go svg{width:24px;height:24px;stroke:#17120a;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:#6f6858;padding:60px 0;font-size:14px}
/* tasks */
.box{margin-top:20px;background:#0f0d08;border:1px solid var(--line);border-radius:24px;padding:14px}
.task{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:22px;background:#0c0a06;padding:16px;margin-top:12px}
.task:first-child{margin-top:0}
.task.pl{border:0;background:none;padding:0 0 0 0}
.task .ic{width:64px;height:64px;border-radius:16px;background:#2a1a24;display:flex;align-items:center;justify-content:center;flex:none;background-size:cover;background-position:center}
.task .ic svg{width:28px;height:28px;stroke:#d9a0ff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.task .ic.b{background:#1b2236}.task .ic.b svg{stroke:#8ea6ff}
.task .tx{flex:1;min-width:0}.task .t{font-weight:700;font-size:18px;line-height:1.15}.task .rw{color:var(--gold2);font-weight:700;font-size:14px;margin-top:6px;display:flex;align-items:center;gap:4px}
.btn{background:var(--gold);color:#17120a;border:0;border-radius:18px;padding:13px 22px;font:700 14px 'Poppins',sans-serif;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(232,184,74,.2);white-space:nowrap}
.btn svg{width:18px;height:18px;stroke:#17120a;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.45}
.btn.big{width:100%;justify-content:center;font-size:20px;padding:14px;border-radius:20px;letter-spacing:.02em;font-weight:600}
/* invites */
.xbtn{display:block;margin:34px 0 0 auto;width:60px;height:60px;border-radius:50%;background:#14110b;border:0;color:#fff;font-size:26px;cursor:pointer}
.h2{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:6px 4px 14px;color:#e6e0d0}
.inv{background:#0f0d08;border:1px solid var(--line);border-radius:24px;padding:14px}
.inv .lk{background:#0a0805;border:1px solid var(--line);border-radius:20px;padding:16px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.inv .lk small{display:block;color:#8a7f66;font-weight:700;font-size:13px;letter-spacing:.1em}
.inv .lk div{min-width:0}.inv .lk b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
.inv .cp{width:56px;height:56px;border-radius:16px;background:#14110b;border:0;color:var(--gold);flex:none;cursor:pointer}
.inv .cp svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.inv .bn{display:flex;justify-content:center;align-items:center;gap:14px;color:#8a7f66;font-weight:700;font-size:14px;margin:14px 0}
.inv .bn span{display:flex;align-items:center;gap:6px}.inv .bn i{font-style:normal;color:#8d8678;font-weight:700}
.fr{display:flex;align-items:center;gap:14px;background:#100e09;border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:12px;min-height:84px}
.fr .ava{width:44px;height:44px;background:#1b1710;color:var(--gold)}
.fr b{font-size:22px;font-weight:600;display:block;line-height:1.1}.fr small{color:#6f6858;font-size:17px;display:block}.fr em{margin-left:auto;color:var(--gold2);font-style:normal;font-weight:700;font-size:13px;display:flex;gap:4px;align-items:center}
.lbl{font-size:22px;font-weight:700;margin:26px 4px 2px;color:#e6e0d0;letter-spacing:-.3px}
/* auction detail */
.top2{display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px}
.back{width:62px;height:62px;border-radius:50%;background:#14110b;border:1px solid var(--line);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.back svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.top2 .tt{text-align:right}.top2 .tt small{display:block;color:#8a7f66;font-weight:700;letter-spacing:.12em;font-size:15px}.top2 .tt b{font-size:30px;font-weight:700}
.dimg{margin-top:14px;border:1px solid var(--line);border-radius:26px;padding:14px;background:#0f0d08}
.dimg .p{height:200px;border-radius:20px;background:#22190d center/cover no-repeat}
.dd{font-size:18px;margin:14px 2px 0;color:#e8e2d2;line-height:1.35}
.gr{display:grid;grid-template-columns:1.2fr 1fr;gap:14px 10px;margin:12px 2px 0;font-size:18px;color:#b8b09c}
.gr b{color:#fff;font-weight:600}
.rk{border-top:1px solid var(--line);margin:16px 2px 0;padding-top:14px;color:#8a7f66;font-weight:700;letter-spacing:.06em;font-size:17px}
.rk .row{display:flex;align-items:center;gap:12px;padding:12px 0;color:#fff;font-weight:600;font-size:16px}
.rk .row i{font-style:normal;width:26px;color:var(--gold)}.rk .row span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk .row.me span{color:var(--gold2)}
.bidbar{position:absolute;left:0;right:0;bottom:0;background:#0a0805;border-top:1px solid var(--line);padding:14px 14px calc(env(safe-area-inset-bottom) + 12px);z-index:11}
.bidbar p{color:#a39a86;font-size:15px;line-height:1.25}.bidbar p.m{color:var(--gold);font-size:14px;margin-top:6px}
.bidbar input{width:100%;margin:12px 0;background:#12100b;border:1px solid var(--line);border-radius:20px;padding:15px 20px;color:#fff;font:600 28px 'Poppins',sans-serif;outline:0;user-select:text;-webkit-user-select:text}
/* profile / boost / admin */
.sec{margin-top:16px;background:#0f0d08;border:1px solid var(--line);border-radius:24px;padding:16px}
.sec h3{font-size:16px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;color:#b8b09c}.kv:last-child{border:0}.kv b{color:#fff}
.fld{width:100%;background:#12100b;border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:#fff;font:500 14px 'Poppins',sans-serif;margin-top:8px;outline:0;user-select:text;-webkit-user-select:text}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:#cfc7b6}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#1d1810;border:1px solid var(--gold);color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:50;max-width:88%;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
/* boost */
.bcard{display:flex;align-items:center;gap:12px;padding:16px 12px;border-radius:30px;border:1px solid rgba(214,170,60,.16);border-top:1px solid rgba(232,184,74,.55);background:linear-gradient(180deg,rgba(62,54,18,.6) 0%,#12100a 45%);cursor:pointer;margin-top:14px}
.bi{width:58px;height:58px;border-radius:18px;border:1px solid rgba(214,170,60,.45);background:#0b0906;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.bi img{width:100%;height:100%;object-fit:cover}
.bi:not(.lg) svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bcard .tx{flex:1;min-width:0}.bcard .tx b{display:block;font-size:17px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bcard .tx small{display:block;font-size:14px;color:#8d8678;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bgo{width:44px;height:44px;border-radius:50%;background:#14110a;border:1px solid rgba(214,170,60,.35);display:flex;align-items:center;justify-content:center;flex:none}
.bgo svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* profil */
.pf{margin-top:16px;background:linear-gradient(180deg,#0e0c08,#0a0805);border:1px solid var(--line);border-radius:30px;padding:18px 16px 20px}
.pf .lb{color:#8a7f66;font-size:14px;font-weight:600;letter-spacing:.04em}
.pf .am{font-size:34px;font-weight:700;color:#35e06f;margin-top:4px;line-height:1.1}.pf .am span{font-size:26px;color:#d8c24e}
.pf .wb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pf .wb button{border:0;border-radius:18px;padding:16px 6px;font:700 17px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;color:#10140c;cursor:pointer;letter-spacing:-.3px}
.pf .wb .g{background:#2ee070}.pf .wb .y{background:var(--gold)}
.pf .wb svg{width:22px;height:22px;stroke:#10140c;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pr2{display:flex;align-items:center;gap:16px;padding:16px;margin-top:12px;border-radius:22px;background:#100e09;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 6px 14px rgba(0,0,0,.35);cursor:pointer}
.pr2 b{flex:1;font-size:19px;font-weight:600;letter-spacing:-.3px}
.pi{width:48px;height:48px;border-radius:14px;border:1px solid rgba(214,170,60,.4);background:#0b0906;display:flex;align-items:center;justify-content:center;flex:none}
.pi svg{width:25px;height:25px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pi .gm svg{stroke:none}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.ov.b{align-items:flex-end;padding:0}
.mc{width:100%;max-height:88%;overflow-y:auto;background:linear-gradient(180deg,#16130c,#0f0d08);border:1px solid rgba(214,170,60,.3);border-radius:28px;padding:18px;scrollbar-width:none}
.ov.b .mc{border-radius:28px 28px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.mh small{color:var(--gold);font-weight:700;letter-spacing:.18em;font-size:13px}.mh b{display:block;font-size:22px;font-weight:700;margin-top:6px;line-height:1.15}
.lockb{width:58px;height:58px;border-radius:18px;border:1px solid rgba(214,170,60,.4);background:#14110a;display:flex;align-items:center;justify-content:center;flex:none}.lockb svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inb{margin-top:16px;border:1px solid var(--line);border-radius:22px;padding:16px;background:#0c0a06}.inb b{font-size:18px}.inb p{color:#a39a86;font-size:15px;line-height:1.6;margin-top:10px}
.msg p{margin-top:12px;font-size:16px;line-height:1.4}
.lb2{color:#8a7f66;font-size:13px;font-weight:700;letter-spacing:.1em;margin:18px 4px 8px}
.fld2{width:100%;background:rgba(12,10,6,.85);border:1px solid var(--line);border-radius:20px;padding:16px 18px;color:#fff;font:500 17px 'Poppins',sans-serif;outline:0;user-select:text;-webkit-user-select:text}
.fld2.ro{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#cfc7b6}
.cprow{display:flex;gap:10px}.cprow .fld2{flex:1;min-width:0}
.cp2{width:58px;border-radius:18px;border:1px solid var(--line);background:#14110b;color:var(--gold);flex:none}.cp2 svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.muted{color:#8d8678;font-size:14px;margin:4px}.kv2{display:flex;justify-content:space-between;padding:10px 4px;color:#cfc7b6;font-size:14px}
.back.s{width:48px;height:48px;flex:none}.lbl2{font-size:15px;font-weight:700;color:#cfc7b6;margin:18px 4px 4px}
.narx{margin-top:16px;border:1px solid var(--line);border-radius:20px;padding:14px 18px}.narx small{color:#8a7f66;font-weight:700;letter-spacing:.1em;font-size:13px}.narx b{display:flex;align-items:center;gap:8px;font-size:28px;margin-top:4px}
.bi.lg{border-radius:16px}.bi.lg svg{width:36px;height:36px}.seg button{display:flex;align-items:center;justify-content:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.btn.alt{background:#1a1710;color:#fff;box-shadow:none;border:1px solid var(--line)}.btn.dim{opacity:.45}
.whl{position:relative;width:min(80vw,320px);margin:14px auto 0}.whl .w{transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}.whl svg{width:100%;display:block}
.whl .pt{position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:9px solid transparent;border-top:22px solid #fff;z-index:2}
.whl .ct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid #fffa;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.si{border:1px solid var(--line);border-radius:22px;padding:10px;background:#100e09}.si.on{border-color:var(--gold)}
.si .pic{position:relative;aspect-ratio:1;border-radius:16px;background:#e0aa28;display:flex;align-items:center;justify-content:center;overflow:hidden}.si .pic img{width:78%;height:78%;border-radius:50%;object-fit:cover}
.si .pc{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border-radius:12px;padding:3px 8px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center}
.si b{display:block;margin-top:8px;font-size:15px}.si small{display:block;color:#8d8678;font-size:12px;margin:2px 0 8px}.si .btn{width:100%;justify-content:center;padding:11px 0;font-size:13px}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:22px}.pod .p{text-align:center;min-width:0}.pod .cr{font-size:26px;line-height:1}

const S = { tab: 'mine', sub: null, st: null, au: null, aTab: 'active', tTab: 'avail', friends: null, detail: null, pending: 0, timer: null, flush: null };
const view = $('#view');
const NAV = [['boost', 'BOOST'], ['tasks', 'VAZIFALAR'], ['mine', 'BOSISH'], ['auction', 'AUKSION'], ['profile', 'PROFIL']];
function renderNav() {
  $('#nav').style.display = (S.sub && (S.sub.t === 'auc' || S.sub.t === 'rcpt')) ? 'none' : 'flex';
  $('#nav').innerHTML = NAV.map(([k, n]) => `<button data-k="${k}" class="${S.tab === k ? 'on' : ''}">${IC[k]}${n}${k === 'tasks' && hasNew() ? '<span class="dot"></span>' : ''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.k; S.sub = null; render(); });
}
const hasNew = () => S.st && (S.st.adsLeft > 0 || S.st.spLeft > 0 || S.st.tasks.some(t => !t.done));
function header() {
  const m = S.st.me, ph = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.photo_url) || m.photo;
  const un = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.username) || m.username;
  return `<div class="hdr"><div class="ava">${ph ? `<img src="${esc(ph)}" onerror="this.remove()">` : esc((m.name || 'X')[0].toUpperCase())}</div>
<div class="who"><small>XORA COIN</small><b>@${esc(un || m.name)}</b></div>
<div class="pill">${gem(20)}<span id="hD">${fmtK(m.diamonds)}</span></div><div class="pill">${coinSm(22)}<span id="hC">${fmtK(m.coins)}</span></div></div>`;
}
function refreshHdr() { const m = S.st.me; const a = $('#hD'), b = $('#hC'); if (a) a.textContent = fmtK(m.diamonds); if (b) b.textContent = fmtK(m.coins); }

async function render() {
  clearInterval(S.timer); renderNav();
  if (!S.st) { view.innerHTML = '<div class="empty">Yuklanmoqda…</div>'; return; }
  if (S.sub && S.sub.t === 'auc') return vDetail();
  if (S.tab === 'mine') return vMine();
  if (S.tab === 'auction') return vAuction();
  if (S.tab === 'tasks') return S.sub && S.sub.t === 'inv' ? vInvites() : vTasks();
  if (S.tab === 'boost') return vBoost();
  if (S.tab === 'profile') return S.sub ? ({ send: vSend, bonus: vBonus, rank: vRank, admin: vAdmin, rcpt: vRcpt }[S.sub.t] || vProfile)() : vProfile();
}

function vMine() {
  const m = S.st.me;
  view.innerHTML = header() + `
<div class="bal">${coinSm(46)}<b id="bal">${fmt(m.coins)}</b></div>
<div class="tapx"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span id="tx">Tap +${m.tap}</span></div>
<div class="coinwrap" id="cw"><div class="coin" id="coin"></div></div>
<div class="mini"><button id="bg">${IC.game}GAME</button><button id="bs">${IC.shop}SHOP</button></div>
<div class="energy"><div class="r"><div class="l"><svg viewBox="0 0 24 24">${IC.bolt.replace(/<\/?svg[^>]*>/g, '')}</svg>ENERGY</div><div class="n"><span id="en">${Math.floor(m.energy)}</span><span>/${m.max}</span></div></div><div class="bar"><i id="eb" style="width:${m.energy / m.max * 100}%"></i></div></div>
<button class="btn big" id="rf" style="margin-top:18px;font-size:22px;font-weight:700;letter-spacing:0;display:${m.energy < m.tap ? 'flex' : 'none'}">💎 10 💎 → +500 ENERGY</button>`;
  const c = $('#coin'); const im = new Image(); im.onload = () => { c.innerHTML = ''; c.appendChild(im); }; im.src = m.itemImg || COIN_IMG; c.innerHTML = m.itemImg ? '' : bigCoin();
  $('#bg').onclick = () => toast('Tez orada!'); $('#bs').onclick = openShop;
  const cw = $('#cw');
  const act = new Set();   // faol barmoqlar (maksimum 2 ta hisoblanadi)
  cw.style.touchAction = 'none';
  cw.addEventListener('pointerdown', e => {
    e.preventDefault(); const m = S.st.me;
    const rc = cw.getBoundingClientRect(), R = rc.width / 2, dx = e.clientX - (rc.left + R), dy = e.clientY - (rc.top + R);
    if (dx * dx + dy * dy > R * R) return;          // faqat dumaloq tanganing ustiga bosilsa
    if (act.size >= 2) return;                      // 3, 4, 5... barmoq bo'lsa ham faqat 2 tasi hisoblanadi
    act.add(e.pointerId);

    if (navigator.vibrate) navigator.vibrate(8); if (TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred('light');
    upd();
  });
  const rel = e => { act.delete(e.pointerId); const c = $('#coin'); if (c && !act.size) c.style.transform = ''; };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cw.addEventListener(ev, rel));
  document.addEventListener('touchend', ev => { if (!ev.touches.length) act.clear(); });
  document.addEventListener('touchcancel', () => act.clear());
  $('#rf').onclick = async () => { await flushTaps(); try { const r = await api('POST', '/api/refill'); S.st.me = r.me; toast('+500 ENERGY ⚡'); render(); } catch (e) { toast(e.message); } };

  S.timer = setInterval(() => { const m = S.st.me; if (m.energy < m.max) { m.energy = Math.min(m.max, m.energy + m.max / 86400); upd(); } }, 1000);
}

  return `<div class="lbl2">Hammaga ko'rinadigan vazifalar</div>` + p.map(x => `<div class="task pl" style="margin-top:12px"><div class="ic" style="width:52px;height:52px;border-radius:10px">${IC.users}</div><div class="tx"><div class="t" style="font-size:20px;font-weight:500">🚀 ${esc(x.title)} 🎁</div><div class="rw">+${x.reward} ${gem(15)}</div></div><button class="btn" data-id="${x.id}" data-u="${esc(x.url)}" style="padding:16px 18px">${IC.play}</button></div>`).join('');
}
function createForm() {
  return `<div class="lb2" style="margin-top:6px">TELEGRAM KANAL USERNAME</div><input class="fld2" id="c_u" placeholder="@username"><div class="lb2">AJRATILADIGAN OLMOS</div><input class="fld2" id="c_g" type="number" inputmode="numeric"><div class="narx"><small>NARXI</small><b><span id="c_p">0</span> ${gem(26)}</b></div><button class="btn big" id="c_b" style="margin-top:18px">Vazifani joylash</button>`;
}
function bindCreate() {
  const g = $('#c_g'); g.oninput = () => $('#c_p').textContent = fmt(+g.value || 0);
  $('#c_b').onclick = async () => { try { await api('POST', '/api/task/create', { url: $('#c_u').value, diamonds: g.value }); S.st = await api('GET', '/api/state'); S.tTab = 'avail'; toast('Vazifa joylandi ✅'); renderNav(); vTasks(); } catch (e) { toast(e.message); } };
}

/* ---------- PROFIL ---------- */
const PI2 = { shield: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>', lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3M12 15v2"/></svg>', ok: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>' };
const go = t => { S.sub = { t }; render(); };
const backRow = t => `<div class="top2" style="margin-top:14px"><button class="back s" id="bk">${IC.back}</button><div class="tt"><b style="font-size:24px">${t}</b></div></div>`;
const bindBk = () => { $('#bk').onclick = () => { S.sub = null; render(); }; };
function openP2P() {
  const o = modal(`<div class="mh"><div><small>COMING SOON</small><b>P2P mavsumi hozircha yopiq.</b></div><div class="lockb">${PI2.lock}</div></div><div class="inb"><b>P2P nima?</b><p>1-iyunga qadar foydalanuvchilar bu yerda olmoslarini sotish va sotib olish imkoniga ega bo'lgan. Bu mavsum auditoriyamiz yana kengayishi bilan tez orada qaytadi.</p></div><button class="btn big" id="ok" style="margin-top:16px">Tushunarli</button>`);
  o.querySelector('#ok').onclick = () => o.remove();
}
function openLang() {
  const o = modal(`<div class="mh"><b>Til</b><button class="back s" id="xl">✕</button></div>` + [['uz', "🇺🇿 O'zbekcha"], ['ru', '🇷🇺 Русский'], ['en', '🇺🇸 English']].map(([k, n]) => `<button class="btn big ${LANG() === k ? '' : 'alt'}" data-l="${k}" style="margin-top:12px">${n}</button>`).join(''), 'b');
  o.querySelector('#xl').onclick = () => o.remove();
  o.querySelectorAll('button[data-l]').forEach(b => b.onclick = () => { localStorage.setItem('xora_lang', b.dataset.l); api('POST', '/api/lang', { l: b.dataset.l }).catch(() => {}); document.documentElement.lang = b.dataset.l; o.remove(); render(); });
}
function showN(n) {
  const body = n.k === 'joined' ? `<p>👤 Siz ${esc(n.who)} taklif havolasi orqali qo'shildingiz.</p><p>📢 Majburiy obuna bajarildi.</p><p>💎 Sizga +10 olmos qo'shildi.</p>` : `<p>👤 ${esc(n.who)} majburiy kanallarga obuna bo'ldi.</p><p>💎 Sizga +50 olmos qo'shildi.</p>`;
  const o = modal(`<div class="msg"><p style="font-size:22px;font-weight:700;margin-top:0">🎉 Tabriklaymiz</p>${body}<button class="btn big" id="nk" style="margin-top:18px">OK</button></div>`);
  o.querySelector('#nk').onclick = () => o.remove();
}
function vProfile() {
  const m = S.st.me;
  const rows = [['p2p', 'P2P bozori'], ['gift', 'Kunlik Bonus'], ['bag', 'Buyurtmalarim'], ['gem', 'Olmos Yuborish'], ['trophy', 'Reyting'], ['spark', 'Maxsus Xizmatlar'], ['globe', 'Til']]; if (m.admin) rows.push(['shield', 'Boshqaruv']);
  const chev = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#a39a86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  view.innerHTML = header() + `<div class="pf"><div class="lb">UZS</div><div class="am">0 <span>UZS</span></div>
<div class="wb"><button class="g">${PI.cardplus}Pul kiritish</button><button class="y">${PI.cash}Pul chiqarish</button></div>
${rows.map(([k, t]) => `<div class="pr2" data-k="${k}"><div class="pi">${k === 'gem' ? `<span class="gm">${gem(28)}</span>` : (PI[k] || PI2[k])}</div><b>${t}</b>${chev}</div>`).join('')}</div>`;
  view.querySelectorAll('.pf button').forEach(b => b.onclick = () => toast('Tez orada!'));
  const H = { p2p: openP2P, gift: () => go('bonus'), bag: () => toast('Tez orada!'), gem: () => go('send'), trophy: () => go('rank'), spark: () => toast('Tez orada!'), globe: openLang, shield: () => go('admin') };
  view.querySelectorAll('.pr2').forEach(r => r.onclick = H[r.dataset.k]);
}
function vBonus() {
  view.innerHTML = header() + backRow('Kunlik Bonus') + `<div class="box" style="margin-top:20px"><div class="lb2" style="margin-top:4px">KUNLIK BONUS KODI</div><input class="fld2" id="b_c" placeholder="UZB" style="text-transform:uppercase"><button class="btn big" id="b_b" style="margin-top:14px">Tekshirish</button></div>`;
  bindBk();
  $('#b_b').onclick = async () => { try { const r = await api('POST', '/api/bonus', { code: $('#b_c').value }); S.st.me = r.me; refreshHdr(); $('#b_c').value = ''; toast('+' + r.reward + ' 💎'); } catch (e) { toast(e.message); } };
}
function vSend() {
  const m = S.st.me, cp = t => `<div class="cprow"><div class="fld2 ro">${esc(t)}</div><button class="cp2" data-c="${esc(t)}">${IC.copy}</button></div>`;
  view.innerHTML = header() + backRow('Olmos Yuborish') + `<div class="lb2">SIZNING TAKLIF HAVOLANGIZ</div>${cp(S.st.link)}<div class="lb2">SIZNING TAKLIF KODINGIZ</div>${cp(m.code)}
<div class="lb2">QABUL QILUVCHI TAKLIF KODI</div><input class="fld2" id="s_c" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase"><div class="lb2">OLMOS MIQDORI</div><input class="fld2" id="s_n" type="number" inputmode="numeric" value="10">
<button class="btn big" id="s_b" style="margin-top:20px">Yuborish</button><div class="lb2">SO'NGGI YUBORISHLAR</div>${S.st.sent.length ? S.st.sent.map(s => `<div class="kv2"><span>${esc(s.to)}</span><b>${s.n} ${gem(14)}</b></div>`).join('') : '<div class="muted">Hali yuborishlar yo\'q</div>'}`;
  bindBk(); view.querySelectorAll('.cp2').forEach(b => b.onclick = () => copyTxt(b.dataset.c));
  $('#s_b').onclick = async () => { try { const r = await api('POST', '/api/send', { code: $('#s_c').value, n: $('#s_n').value }); S.st.me = r.me; S.st.sent.unshift(r.tx); snd('send'); S.sub = { t: 'rcpt', tx: r.tx }; render(); } catch (e) { toast(e.message); } };
}
function vRcpt() {
  const x = S.sub.tx, d = new Date(x.at);
  view.innerHTML = `<div class="rc"><div class="ck">${PI2.ok}</div><h2>TO'LOV MUVAFFAQIYATLI</h2><div class="sb">TRANZAKSIYA TASDIQLANDI</div>
<div class="rcc"><div class="tt2">JAMI MIQDOR</div><div class="am2">${x.n} ${gem(34)}</div><div class="r"><span>JO'NATUVCHI</span><b>${esc(x.from)}</b></div><div class="r"><span>QABUL QILUVCHI</span><b>${esc(x.to)}</b></div><div class="r"><span>TRANZAKSIYA ID</span><b>${x.id}</b></div><div class="r"><span>TARMOQ KOMISSIYASI</span><b style="color:#35e06f">0.00 ${gem(14)}</b></div><div class="r"><span>VAQT</span><b>${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}</b></div></div>
<button class="btn big" id="dv" style="margin-top:26px">DAVOM ETISH</button><div class="ft">XORA NETWORK PROTOCOL TOMONIDAN HIMOYALANGAN</div></div>`;
  $('#dv').onclick = () => { S.sub = null; render(); };
}
async function vRank() {
  const tab = S.rTab || 'dia';
  view.innerHTML = header() + backRow('Reyting') + '<div class="empty">Yuklanmoqda…</div>'; bindBk();
  let r = { dia: [], coin: [] }; try { r = await api('GET', '/api/rank'); } catch (e) {}
  if (S.tab !== 'profile' || !S.sub || S.sub.t !== 'rank') return;
  const L = r[tab], ic = tab === 'dia' ? gem(16) : coinSm(16);
  const pd = (i, c) => { const x = L[i]; return x ? `<div class="p ${c}">${c === 'p1' ? '<div class="cr">👑</div>' : ''}<div class="av">${esc(x.n.replace('@', '')[0].toUpperCase())}</div><div class="nm">${esc(x.n)}</div><div class="vl">${ic}${fmt(x.v)}</div></div>` : '<div></div>'; };
  const bk = (n, h) => `<div class="bk" style="height:${h}px">${n}</div>`;
  view.innerHTML = header() + backRow('Reyting') + `<div class="seg"><button data-t="dia" class="${tab === 'dia' ? 'on' : ''}">Olmos</button><button data-t="coin" class="${tab === 'coin' ? 'on' : ''}">Tanga</button></div>
<div class="pod"><div>${pd(1, 'p2')}${bk(2, 70)}</div><div>${pd(0, 'p1')}${bk(1, 96)}</div><div>${pd(2, 'p3')}${bk(3, 56)}</div></div>
${L.slice(3).map((x, i) => `<div class="rkr"><i>${i + 4}</i><div><b>${esc(x.n)}</b><small>${ic}${fmt(x.v)}</small></div></div>`).join('')}`;
  bindBk(); view.querySelectorAll('.seg button').forEach(b => b.onclick = () => { S.rTab = b.dataset.t; vRank(); });
}

/* ---------- ADMIN (boshqaruv) ---------- */
function pickImg(el, max, cb) {
  el.onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'), k = Math.min(1, max / Math.max(im.width, im.height)); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL(max > 500 ? 'image/jpeg' : 'image/png', .85)); toast('Rasm tayyor'); }; im.src = r.result; }; r.readAsDataURL(f); };
}
async function vAdmin() {
  if (!S.st.me.admin) { S.sub = null; return render(); }
  let st = {}; try { st = await api('GET', '/api/admin/stats'); } catch (e) {}
  const I = (id, ph, t, v) => `<input class="fld" id="${id}" placeholder="${ph}"${t ? ` type="${t}"` : ''}${v != null ? ` value="${v}"` : ''}>`;
  const SK = [['tap', 'TAP bosilganda'], ['send', 'Olmos yuborilganda'], ['task', 'Vazifa bajarilganda'], ['order', 'Buyurtma berilganda']];
  view.innerHTML = header() + backRow('Boshqaruv') + `
<div class="sec"><h3>📊 Statistika</h3>${[['Foydalanuvchilar', st.users], ['Jami olmos', st.dia], ['Jami tanga', st.coins], ['Vazifalar', st.tasks], ['Auksionlar', st.auc], ["Do'kon coinlari", st.shop], ['Bonus kodlar', st.codes]].map(([a, b]) => `<div class="kv"><span>${a}</span><b>${b ?? 0}</b></div>`).join('')}</div>
<div class="sec"><h3>💎 Olmos / 🪙 Coin to'ldirish yoki yechish</h3>${I('u_id', 'Foydalanuvchi ID')}${I('u_a', "Miqdor (yechish uchun minus: -50)", 'number')}<div class="two"><button class="btn" id="u_d" style="justify-content:center">💎 Olmos</button><button class="btn" id="u_c" style="justify-content:center">🪙 Coin</button></div></div>
<div class="sec"><h3>🏷 Auksion qo'shish</h3>${I('a_t', 'Nomi (masalan: 100$)')}${I('a_s', 'Qisqa izoh')}${I('a_d', 'Tavsif')}${I('a_i', 'Rasm havolasi (URL)')}<input class="fld" type="file" id="a_f" accept="image/*">${I('a_p', "Boshlang'ich narx", 'number', 1000)}${I('a_st', 'Qadam', 'number', 1000)}${I('a_h', 'Davomiyligi (soat)', 'number', 24)}<label class="chk"><input type="checkbox" id="a_a"> ♻ AUTO (tugagach qayta boshlansin)</label><button class="btn big" id="a_b" style="margin-top:14px;font-size:16px">QO'SHISH</button></div>
<div class="sec"><h3>✅ Vazifa qo'shish</h3>${I('t_t', 'Nomi')}${I('t_u', 'Havola (https://t.me/...)')}${I('t_r', 'Olmos miqdori', 'number', 1)}<button class="btn big" id="t_b" style="margin-top:14px;font-size:16px">QO'SHISH</button></div>
<div class="sec"><h3>🛒 Do'kon (SHOP) coin qo'shish</h3>${I('s_n', 'Nomi (masalan: Nezuko)')}${I('s_i', 'Rasm havolasi (URL)')}<input class="fld" type="file" id="s_f" accept="image/*">${I('s_p', 'Narxi (olmos)', 'number', 500)}${I('s_k', 'Tap kuchi (x click)', 'number', 2)}${I('s_e', 'Max energiya', 'number', 1000)}<div class="muted">Tap kuchi 5 bo'lsa, har bosishda 5 energiya yechiladi (1000 energiya = 200 marta bosish). Darajalar qo'shilish tartibida ochiladi.</div><button class="btn big" id="s_b" style="margin-top:10px;font-size:16px">QO'SHISH</button></div>
<div class="sec"><h3>🎁 Kunlik bonus kodi</h3>${I('k_c', 'Kod (masalan: UZB)')}${I('k_r', 'Olmos miqdori', 'number', 5)}${I('k_l', 'Necha kishi ishlata oladi', 'number', 100)}<button class="btn big" id="k_b" style="margin-top:14px;font-size:16px">QO'SHISH</button></div>
<div class="sec"><h3>🔊 Ovozlar</h3>${SK.map(([k, n]) => `<div class="lb2" style="margin:12px 2px 0">${n}</div>${I('v_u_' + k, 'Ovoz havolasi (URL)')}<input class="fld" type="file" id="v_f_${k}" accept="audio/*"><button class="btn" id="v_b_${k}" style="margin-top:8px">SAQLASH</button>`).join('')}</div>
<div class="sec"><h3>🤖 Bot: start xabari va kanallar</h3><div class="muted">Bo'sh qoldirsangiz o'zgarmaydi. Asl holatga qaytarish uchun "-" yozing.</div>
<textarea class="fld" id="b_u" rows="4" placeholder="Start izohi (O'zbekcha, HTML mumkin)"></textarea><textarea class="fld" id="b_r" rows="4" placeholder="Start izohi (Русский)"></textarea><textarea class="fld" id="b_e" rows="4" placeholder="Start izohi (English)"></textarea>
<input class="fld" id="b_i" placeholder="Start rasmi havolasi (URL)"><input class="fld" type="file" id="b_f" accept="image/*"><input class="fld" id="b_a" placeholder="Ilova havolasi (Mini App URL)"><input class="fld" id="b_ch" placeholder="Majburiy kanallar: @kanal1,@kanal2">
<button class="btn big" id="b_b" style="margin-top:14px;font-size:16px">SAQLASH</button></div>
<div class="sec"><h3>📣 Hammaga xabar yuborish</h3><textarea class="fld" id="m_t" rows="4" placeholder="Xabar matni (HTML mumkin)"></textarea><button class="btn big" id="m_b" style="margin-top:14px;font-size:16px">YUBORISH</button></div>`;
  bindBk();
  const run = async (f, ok) => { try { await f(); toast(ok); } catch (e) { toast(e.message); } };
  $('#u_d').onclick = () => run(() => api('POST', '/api/admin/user', { id: $('#u_id').value, f: 'diamonds', n: $('#u_a').value }), 'Bajarildi ✅');
  $('#u_c').onclick = () => run(() => api('POST', '/api/admin/user', { id: $('#u_id').value, f: 'coins', n: $('#u_a').value }), 'Bajarildi ✅');
  let file = '', sf = ''; pickImg($('#a_f'), 900, d => file = d); pickImg($('#s_f'), 400, d => sf = d);
  $('#a_b').onclick = () => run(async () => { await api('POST', '/api/admin/auction', { title: $('#a_t').value, sub: $('#a_s').value, desc: $('#a_d').value, img: file || $('#a_i').value, startPrice: $('#a_p').value, step: $('#a_st').value, hours: $('#a_h').value, auto: $('#a_a').checked }); S.au = null; }, "Auksion qo'shildi ✅");
  $('#t_b').onclick = () => run(async () => { await api('POST', '/api/admin/task', { title: $('#t_t').value, url: $('#t_u').value, reward: $('#t_r').value }); S.st = await api('GET', '/api/state'); }, "Vazifa qo'shildi ✅");
  $('#s_b').onclick = () => run(() => api('POST', '/api/admin/shop', { name: $('#s_n').value, img: sf || $('#s_i').value, price: $('#s_p').value, click: $('#s_k').value, energy: $('#s_e').value }), "Coin qo'shildi ✅");
  $('#k_b').onclick = () => run(() => api('POST', '/api/admin/code', { code: $('#k_c').value, reward: $('#k_r').value, left: $('#k_l').value }), "Kod qo'shildi ✅");
  let bf = ''; pickImg($('#b_f'), 900, d => bf = d);
  $('#b_b').onclick = () => run(() => api('POST', '/api/admin/start', { cap_uz: $('#b_u').value, cap_ru: $('#b_r').value, cap_en: $('#b_e').value, img: bf || $('#b_i').value, app_url: $('#b_a').value, channels: $('#b_ch').value }), 'Saqlandi ✅');
  $('#m_b').onclick = async () => { try { const r = await api('POST', '/api/admin/broadcast', { text: $('#m_t').value }); toast('Yuborildi: ' + r.sent + ', xato: ' + r.failed); } catch (e) { toast(e.message); } };
  SK.forEach(([k]) => {
    let d = ''; $('#v_f_' + k).onchange = e => { const f = e.target.files[0]; if (!f) return; if (f.size > 400000) return toast('Fayl katta (400 KB gacha)'); const r = new FileReader(); r.onload = () => { d = r.result; toast('Tayyor'); }; r.readAsDataURL(f); };
    $('#v_b_' + k).onclick = () => run(() => api('POST', '/api/admin/sound', { k, v: d || $('#v_u_' + k).value }), 'Saqlandi ✅');
  });
}

/* ---------- start ---------- */
(async () => {
  render();
  try { S.st = await api('GET', '/api/state'); } catch (e) { view.innerHTML = '<div class="empty">Xatolik yuz berdi. Sahifani yangilang.</div>'; return; }
  render();
  (S.st.notif || []).forEach(showN);
})();
</script>
